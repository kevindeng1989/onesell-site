<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OneSell ERP · AI ERP for TikTok Shop sellers</title>
<meta name="description" content="OneSell ERP is an ERP for TikTok Shop sellers: AI listing, product images, order sync, shipping label printing, after-sales and profit reports in one place.">
<link rel="icon" href="favicon-64.png">
<link rel="apple-touch-icon" href="apple-180.png">
<style>
:root{--brand:#002050;--accent:#fe2c55;--bg:#f5f7fb;--card:#fff;--fg:#1f2937;--muted:#5b6474;--line:#e5e7eb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans Thai",sans-serif}
a{color:#2f6fc4}
header.top{background:var(--brand);color:#fff}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-weight:700;font-size:18px}
.logo img{width:34px;height:34px;border-radius:8px}
.langs{display:flex;gap:6px;flex-wrap:wrap}
.langs button{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer}
.langs button[aria-pressed=true]{background:#fff;color:var(--brand);border-color:#fff}
.hero{padding:56px 0 64px}
.tag{display:inline-block;background:rgba(254,44,85,.16);color:#ffd0da;border-radius:999px;padding:4px 12px;font-size:13px;margin-bottom:14px}
.hero h1{font-size:40px;line-height:1.2;margin:0 0 14px;max-width:760px}
.hero h1 span{color:var(--accent)}
.hero p{font-size:18px;color:#d6deeb;max-width:720px;margin:0 0 24px}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-block;padding:11px 20px;border-radius:10px;font-weight:600;text-decoration:none}
.btn.primary{background:var(--accent);color:#fff}
.btn.ghost{border:1px solid rgba(255,255,255,.5);color:#fff}
.pipe{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:40px}
.pipe div{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:14px 16px}
.pipe b{display:block;color:#fff}.pipe small{color:#b9c4d6}
section{padding:56px 0}
section h2{font-size:28px;margin:0 0 8px}
.lead{color:var(--muted);margin:0 0 28px;max-width:720px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
.card h3{margin:0 0 6px;font-size:19px}
.card ul{margin:10px 0 0;padding-left:20px;color:var(--muted)}
.card li{margin:4px 0}
.ico{width:40px;height:40px;border-radius:10px;background:#eef3fb;display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:12px}
.steps{counter-reset:s;display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.steps .card{position:relative;padding-top:52px}
.steps .card::before{counter-increment:s;content:counter(s);position:absolute;top:18px;left:22px;width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}
.sites{display:flex;flex-wrap:wrap;gap:8px}
.sites span{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px}
.alt{background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
footer{color:var(--muted);font-size:14px;padding:28px 0 40px}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media(max-width:760px){.hero h1{font-size:30px}.grid,.steps,.pipe{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="bar">
      <a class="logo" href="./"><img src="brand-256.png" alt="">OneSell ERP</a>

        <button data-l="th">ไทย</button>

        <button data-l="zh">中文</button>
      </nav>

        <a class="btn ghost" href="#features" data-t="ctaFeatures"></a>
      </div>
      <div class="pipe">
        <div><b data-t="p1"></b><small data-t="p1d"></small></div>
        <div><b data-t="p2"></b><small data-t="p2d"></small></div>
        <div><b data-t="p3"></b><small data-t="p3d"></small></div>
      </div>
    </div>
  </div>
</header>

<main>
<section id="features">
  <div class="wrap">

    <p class="lead" data-t="fLead"></p>

      <div class="card"><div class="ico">📊</div><h3 data-t="f4"></h3><p data-t="f4d"></p><ul data-list="f4l"></ul></div>
    </div>
  </div>
</section>

<section id="start" class="alt">
  <div class="wrap">
    <h2 data-t="sTitle"></h2>
    <p class="lead" data-t="sLead"></p>
    <div class="steps">
      <div class="card"><h3 data-t="s1"></h3><p data-t="s1d"></p></div>
      <div class="card"><h3 data-t="s2"></h3><p data-t="s2d"></p></div>
      <div class="card"><h3 data-t="s3"></h3><p data-t="s3d"></p></div>
    </div>
  </div>
</section>

<section>
  <div class="wrap">
    <h2 data-t="mTitle"></h2>
    <p class="lead" data-t="mLead"></p>
    <div class="sites" data-sites></div>
    <h2 style="margin-top:44px" data-t="dTitle"></h2>
    <p class="lead" data-t="dLead"></p>
  </div>
</section>
</main>

<footer>

const LANGS = Object.keys(T);
function pick(){
  const q = new URLSearchParams(location.search).get('lang');
  if (q && T[q]) return q;
  const n = (navigator.language || 'en').toLowerCase();
  const m = n.split('-')[0];
  if (m === 'in') return 'id';
  return T[m] ? m : 'en';
}
function apply(l){
  const d = T[l];
  document.documentElement.lang = l === 'zh' ? 'zh-CN' : l;
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = d[el.dataset.t] ?? T.en[el.dataset.t]; });
  document.querySelectorAll('[data-list]').forEach(el => { el.innerHTML = ''; d[el.dataset.list].forEach(t => { const li = document.createElement('li'); li.textContent = t; el.appendChild(li); }); });
  const s = document.querySelector('[data-sites]'); s.innerHTML = ''; d.sites.forEach(t => { const sp = document.createElement('span'); sp.textContent = t; s.appendChild(sp); });
  document.querySelectorAll('.langs button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.l === l)));
  document.title = 'OneSell ERP · ' + d.tag;
}
document.querySelectorAll('.langs button').forEach(b => b.addEventListener('click', () => {
  apply(b.dataset.l);
  const u = new URL(location.href); u.searchParams.set('lang', b.dataset.l); history.replaceState(null, '', u);
}));
apply(pick());
